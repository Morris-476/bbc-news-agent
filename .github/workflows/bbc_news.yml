name: BBC News Daily PDF Agent

on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"

  workflow_dispatch:
    inputs:
      session:
        description: "?瑁??挾"
        required: true
        default: "noon"
        type: choice
        options:
          - noon
          - evening

jobs:
  run-agent:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Determine session
        id: session
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SESSION=${{ github.event.inputs.session }}" >> $GITHUB_OUTPUT
          elif [ "$(date -u +%H)" = "04" ]; then
            echo "SESSION=noon" >> $GITHUB_OUTPUT
          else
            echo "SESSION=evening" >> $GITHUB_OUTPUT
          fi

      - name: Run BBC News Agent
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python src/main.py --session ${{ steps.session.outputs.SESSION }}

      - name: Commit used_articles.json
        run: |
          git config user.name "BBC News Agent"
          git config user.email "agent@bbc-news.local"
          git add data/used_articles.json
          git diff --staged --quiet || git commit -m "chore: update used articles [skip ci]"
          git push
